<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc Study</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #DEDACA;
      color: #234A42;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }

    h1 {
      margin: 4px 0 8px 0;
      font-size: clamp(36px, 10vw, 52px);
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
    }

    .subtitle {
      margin: 0;
      color: #333333;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .tile {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    .tile > div {
      position: absolute;
    }

    .label {
      position: absolute;
      left: 6%;
      bottom: 6%;
      margin: 0;
      font-size: clamp(8px, 2.2vw, 11px);
      font-weight: bold;
      text-transform: uppercase;
      color: #4A3A30;
    }

    .tile-1 {
      background-color: #D4A782;
    }

    .half-circle {
      left: 16%;
      top: 23%;
      width: 68%;
      height: 34%;
      background-color: #A84B35;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }

    .half-line {
      left: 16%;
      top: 62%;
      width: 68%;
      height: 2px;
      background-color: #A84B35;
    }

    .tile-2 {
      background-color: #234A42;
    }

    .tile-2 .label {
      color: #F2EBDD;
    }

    .quarter-big {
      left: 22%;
      top: 20%;
      width: 53%;
      height: 53%;
      background-color: #DCC28E;
      border-bottom-right-radius: 100%;
    }

    .quarter-small {
      left: 53%;
      top: 51%;
      width: 25%;
      height: 25%;
      background-color: #D18B6F;
      border-top-left-radius: 100%;
    }

    .tile-3 {
      background-color: #C9765E;
    }

    .three-quarters {
      left: 18%;
      top: 8%;
      width: 64%;
      height: 64%;
      border-radius: 50%;
      background: conic-gradient(transparent 0deg 90deg, #E8D5B9 90deg 360deg);
    }

    .quarter-dark {
      left: 56%;
      top: 12%;
      width: 22%;
      height: 22%;
      background-color: #7A332B;
      border-top-right-radius: 100%;
    }

    .tile-4 {
      background-color: #D6C7A0;
    }

    .arc {
      border-radius: 50%;
      -webkit-mask: conic-gradient(from -60deg, #000 0deg 120deg, transparent 120deg);
      mask: conic-gradient(from -60deg, #000 0deg 120deg, transparent 120deg);
    }

    .arc-outer {
      left: 16%;
      top: 26%;
      width: 68%;
      height: 68%;
      background: radial-gradient(closest-side, transparent 81%, #234A42 82% 99%, transparent 100%);
    }

    .arc-inner {
      left: 29%;
      top: 39%;
      width: 42%;
      height: 42%;
      background: radial-gradient(closest-side, transparent 83%, #B85640 84% 98%, transparent 100%);
    }

    footer {
      margin-top: 28px;
    }

    footer h2 {
      margin: 0 0 8px 0;
      font-size: 15px;
      text-transform: uppercase;
    }

    footer p {
      margin: 0;
      color: #333333;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .page {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">Form / Colour / Angle</p>
      <h1>Arc Study</h1>
      <p class="subtitle">One circle. Many possibilities.</p>
    </header>

    <section class="grid">
      <div class="tile tile-1">
        <div class="half-circle"></div>
        <div class="half-line"></div>
        <p class="label">01 / Half circle / 180°</p>
      </div>

      <div class="tile tile-2">
        <div class="quarter-big"></div>
        <div class="quarter-small"></div>
        <p class="label">02 / Quarter sectors / 90°</p>
      </div>

      <div class="tile tile-3">
        <div class="three-quarters"></div>
        <div class="quarter-dark"></div>
        <p class="label">03 / Three quarters / 270°</p>
      </div>

      <div class="tile tile-4">
        <div class="arc arc-outer"></div>
        <div class="arc arc-inner"></div>
        <p class="label">04 / Open arcs / 120°</p>
      </div>
    </section>

    <footer>
      <h2>Circular thinking</h2>
      <p>Canvas geometry / beginPath · arc · fill · stroke</p>
    </footer>
  </main>
</body>
</html>
